# Mascarenhas Hub — evita a pausa automática do Supabase Free Tier (7 dias sem atividade).
# Configure os secrets SUPABASE_URL e SUPABASE_ANON_KEY no repositório
# (Settings -> Secrets and variables -> Actions).
name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 9 */5 * *' # a cada 5 dias, 09:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Healthcheck leve no Supabase (RPC server_now)
        run: |
          curl -fsS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/server_now" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
